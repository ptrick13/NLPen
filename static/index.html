<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NLPen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e;
      --surface: #1a1a1a;
      --accent: #3d7fff;
      --accent-hover: #5590ff;
      --text: #e8e8e8;
      --text-muted: #888;
      --border: #2a2a2a;
      --error: #ff5555;
      --success: #4caf7d;
      --radius: 14px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 44px;
      width: 100%;
      max-width: 460px;
    }

    .card-title {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 6px;
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.65;
      margin-bottom: 32px;
    }

    /* Upload area */
    .upload-area {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 28px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s;
      margin-bottom: 24px;
    }
    .upload-area:hover,
    .upload-area.dragover {
      border-color: var(--accent);
      background: rgba(61, 127, 255, 0.04);
    }
    .upload-area:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .upload-icon {
      width: 34px;
      height: 34px;
      margin: 0 auto 10px;
      color: var(--text-muted);
    }
    .upload-hint {
      font-size: 13px;
      color: var(--text-muted);
    }
    .upload-hint strong {
      color: var(--accent);
      font-weight: 500;
    }
    .upload-filename {
      display: none;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      margin-top: 4px;
    }
    .upload-change {
      display: none;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Checkboxes */
    .options-label {
      font-size: 11px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .checkboxes {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 28px;
    }

    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
      user-select: none;
    }

    .checkbox-row input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 17px;
      height: 17px;
      border: 1.5px solid #666;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      margin-top: 2px;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }
    .checkbox-row input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }
    .checkbox-row input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 5px;
      height: 9px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(40deg);
    }
    .checkbox-row input[type="checkbox"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .checkbox-row input[type="checkbox"]:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .checkbox-row:has(input:disabled) {
      cursor: not-allowed;
      opacity: 0.5;
    }
    .checkbox-row span {
      font-size: 14px;
      line-height: 1.5;
    }

    /* Buttons */
    .btn-primary {
      width: 100%;
      padding: 11px 20px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.18s, opacity 0.18s;
      margin-bottom: 10px;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

    .download-link {
      display: none;
      width: 100%;
      padding: 11px 20px;
      border: 1.5px solid var(--success);
      border-radius: 8px;
      background: transparent;
      color: var(--success);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.18s;
      margin-bottom: 10px;
    }
    .download-link:hover { background: rgba(76, 175, 125, 0.08); }
    .download-link:focus-visible { outline: 2px solid var(--success); outline-offset: 2px; }

    .error-msg {
      display: none;
      font-size: 13px;
      color: var(--error);
      margin-top: 2px;
      line-height: 1.5;
    }

    input[type="file"] { display: none; }

    fieldset {
      border: none;
      padding: 0;
      margin: 0;
    }
    fieldset legend.options-label {
      float: left;
      width: 100%;
      margin-bottom: 12px;
    }
    fieldset .checkboxes {
      clear: left;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="card-title">NLPen</h1>
    <p class="card-subtitle">
      Lade eine PDF-Datei hoch und wähle bis zu zwei Analyseoptionen aus.<br>
      Die annotierte PDF wird direkt zum Download bereitgestellt.
    </p>

    <input type="file" id="file-input" accept="application/pdf" aria-label="PDF-Datei auswählen">
    <div class="upload-area" id="upload-area"
         role="button"
         tabindex="0"
         aria-label="PDF-Datei auswählen oder hier ablegen">
      <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14,2 14,8 20,8"/>
        <line x1="12" y1="13" x2="12" y2="18"/>
        <polyline points="9,16 12,13 15,16"/>
      </svg>
      <div class="upload-hint" id="upload-hint"><strong>PDF auswählen</strong> oder hier ablegen</div>
      <div class="upload-filename" id="upload-filename"></div>
      <div class="upload-change" id="upload-change">Klicken zum Ändern</div>
    </div>

    <fieldset>
      <legend class="options-label">Analyseoptionen</legend>
      <div class="checkboxes">
        <label class="checkbox-row">
          <input type="checkbox" id="summarize">
          <span>Markiere die wichtigsten Sätze</span>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="sentiment">
          <span>Markiere Sätze mit positiver und negativer Stimmung</span>
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="ner">
          <span>Markiere Personen, Orte, Organisationen und andere Namen</span>
        </label>
      </div>
    </fieldset>

    <div class="sr-only" id="status-msg" aria-live="polite" aria-atomic="true"></div>
    <button class="btn-primary" id="analyze-btn">PDF analysieren</button>
    <a class="download-link" id="download-link" download>Annotierte PDF herunterladen</a>
    <p class="error-msg" id="error-msg" role="alert"></p>
  </div>

  <script>
    const fileInput    = document.getElementById('file-input');
    const uploadArea   = document.getElementById('upload-area');
    const uploadHint   = document.getElementById('upload-hint');
    const uploadIcon   = uploadArea.querySelector('.upload-icon');
    const uploadFilename = document.getElementById('upload-filename');
    const uploadChange = document.getElementById('upload-change');
    const analyzeBtn   = document.getElementById('analyze-btn');
    const downloadLink = document.getElementById('download-link');
    const errorMsg     = document.getElementById('error-msg');
    const statusMsg    = document.getElementById('status-msg');
    const cbSummarize  = document.getElementById('summarize');
    const cbSentiment  = document.getElementById('sentiment');
    const cbNer        = document.getElementById('ner');

    const allCheckboxes = [cbSummarize, cbSentiment, cbNer];

    function updateCheckboxes() {
      const nSelected = allCheckboxes.filter(c => c.checked).length;
      allCheckboxes.forEach(cb => {
        cb.disabled = nSelected >= 2 && !cb.checked;
      });
    }

    allCheckboxes.forEach(cb => cb.addEventListener('change', updateCheckboxes));

    let selectedFile = null;
    let blobUrl = null;
    let dotTimer = null;

    uploadArea.addEventListener('click', () => fileInput.click());
    uploadArea.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); }
    });
    fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });

    uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
    uploadArea.addEventListener('drop', e => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      const f = e.dataTransfer.files[0];
      if (f && f.type === 'application/pdf') setFile(f);
    });

    function setFile(file) {
      selectedFile = file;
      uploadIcon.style.display = 'none';
      uploadHint.style.display = 'none';
      uploadFilename.textContent = file.name;
      uploadFilename.style.display = 'block';
      uploadChange.style.display = 'block';
      uploadArea.setAttribute('aria-label', `${file.name} ausgewählt. Klicken zum Ändern.`);
      resetResult();
    }

    function resetResult() {
      if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null; }
      downloadLink.style.display = 'none';
      downloadLink.removeAttribute('href');
      errorMsg.style.display = 'none';
    }

    analyzeBtn.addEventListener('click', async () => {
      if (!selectedFile) {
        showError('Bitte wähle zuerst eine PDF-Datei aus.');
        return;
      }
      const nSelected = allCheckboxes.filter(c => c.checked).length;
      if (nSelected === 0) {
        showError('Bitte wähle mindestens eine Analyseoption aus.');
        return;
      }

      resetResult();
      setLoading(true);

      const formData = new FormData();
      formData.append('file', selectedFile);
      formData.append('summarize', cbSummarize.checked.toString());
      formData.append('sentiment', cbSentiment.checked.toString());
      formData.append('ner', cbNer.checked.toString());

      try {
        const res = await fetch('/analyze', { method: 'POST', body: formData });
        if (!res.ok) {
          let detail = 'Analyse fehlgeschlagen.';
          try { detail = (await res.json()).detail; } catch {}
          throw new Error(detail);
        }
        const blob = await res.blob();
        blobUrl = URL.createObjectURL(blob);
        const cd = res.headers.get('Content-Disposition') || '';
        const match = cd.match(/filename[^;=\n]*="?([^";\n]*)"?/);
        downloadLink.href = blobUrl;
        downloadLink.download = match ? match[1] : 'analysiert.pdf';
        downloadLink.style.display = 'block';
        statusMsg.textContent = 'Analyse abgeschlossen. Annotierte PDF zum Download bereit.';
      } catch (err) {
        showError(err.message);
      } finally {
        setLoading(false);
      }
    });

    function setLoading(on) {
      analyzeBtn.disabled = on;
      analyzeBtn.setAttribute('aria-busy', on ? 'true' : 'false');
      if (on) {
        let dots = 0;
        analyzeBtn.textContent = 'Analysiere';
        statusMsg.textContent = 'Analyse läuft, bitte warten.';
        dotTimer = setInterval(() => {
          dots = (dots + 1) % 4;
          analyzeBtn.textContent = 'Analysiere' + '.'.repeat(dots);
        }, 500);
      } else {
        clearInterval(dotTimer);
        dotTimer = null;
        analyzeBtn.textContent = 'PDF analysieren';
      }
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }
  </script>
</body>
</html>
